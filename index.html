    <h2>네트워크 개념</h2>
    <p>네트워크 : 2대 이상의 장치가 서로 연결되어 데이터를 주고받을 수 있도록 만든 연결망</p>
    구성 요소 <br/>
노드 : 데이터를 송수신 하거나 전달하는 장치(pc, 스마트폰, 서버 등)<br/>
링크 ; 노드와 노드를 연결하는 통신 경로 (광섬유, wi-fi, 5g등)<br/>
프로토콜 : 데이터를 주고받기 위한 규칙(ip, tcp, http, dns 등)<br/>
